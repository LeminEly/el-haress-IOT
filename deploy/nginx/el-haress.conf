# El-Haress — Nginx : sert le build React et proxifie l'API + le WebSocket.
# A placer dans /etc/nginx/sites-available/ et a lier dans sites-enabled/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/el-haress/app/frontend/dist;
    index index.html;

    include /etc/nginx/snippets/el-haress-security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Build React (SPA) : tout le reste retombe sur index.html.
    location / {
        try_files $uri /index.html;
    }

    # Cache long pour les assets versionnes (hash dans le nom de fichier).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API REST + WebSocket -> backend Uvicorn/Gunicorn.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mise a niveau WebSocket (/api/v1/ws/live).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

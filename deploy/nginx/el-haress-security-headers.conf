# En-tetes de securite — a inclure dans le server block (snippet Nginx).
# A placer dans /etc/nginx/snippets/el-haress-security-headers.conf.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP du tableau de bord. Polices auto-hebergees (font-src 'self'). Le WebSocket et
# l'API sont en meme origine (connect-src 'self', plus ws/wss pour le temps reel).
# 'unsafe-inline' sur style-src : attributs de style en ligne des graphes (Recharts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
